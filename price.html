<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BSV Price</title>
  </head>
  <body>
    <h2 id="bsv-price">Loading...</h2>

    <script>
      async function fetchBSVPrice() {
        const response = await fetch(
          "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin-sv&vs_currencies=usd"
        );
        const data = await response.json();
        const price = data["bitcoin-sv"].usd;

        document.getElementById("bsv-price").innerText = `1 BSV = $${price}`;
      }

      fetchBSVPrice();
      // Refresh price every 30 seconds
      setInterval(fetchBSVPrice, 30000);
    </script>
  </body>
</html>
